# Image import for Hygraph — paste into the project's API Playground.
#
# Run the steps IN ORDER. Steps 1-3 create the assets AND attach them in the
# same call, so there are no ids to copy by hand. Step 4 publishes everything.
#
# Requires these fields to exist first:
#   Property.images  -> Asset picker, ALLOW MULTIPLE
#   Agent.photo      -> Asset picker, single
#   Agency.logo      -> Asset picker, single
#
# Every URL below was checked and returns 200 with an image content-type.


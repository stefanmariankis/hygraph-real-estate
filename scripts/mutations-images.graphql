# ---------------------------------------------------------------------------
# STEP 3 — one image per agency (3 assets)
# Building shots standing in for real logos.
# ---------------------------------------------------------------------------
mutation AddAgencyLogos {
  g1: updateAgency(
    where: { slug: "transilvania-imobiliare" }
    data: { logo: { create: { uploadUrl: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800&q=80&auto=format&fit=crop", fileName: "transilvania-imobiliare.jpg" } } }
  ) { id name }

  g2: updateAgency(
    where: { slug: "urban-estate" }
    data: { logo: { create: { uploadUrl: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&q=80&auto=format&fit=crop", fileName: "urban-estate.jpg" } } }
  ) { id name }

  g3: updateAgency(
    where: { slug: "west-home" }
    data: { logo: { create: { uploadUrl: "https://images.unsplash.com/photo-1416331108676-a22ccb276e35?w=800&q=80&auto=format&fit=crop", fileName: "west-home.jpg" } } }
  ) { id name }

}


# ---------------------------------------------------------------------------
# STEP 4 — publish everything
# New assets and the edited entries are all sitting in DRAFT until this runs.
# Wait a few seconds after step 3: Hygraph downloads each file in the
# background, and publishing an asset it has not finished fetching will fail.
# ---------------------------------------------------------------------------
mutation PublishEverything {
  assets: publishManyAssetsConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id fileName } }
  }
  properties: publishManyPropertiesConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id title } }
  }
  agents: publishManyAgentsConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id fullName } }
  }
  agencies: publishManyAgenciesConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id name } }
  }
}

# ---------------------------------------------------------------------------
# STEP 5 — check it worked (safe to run on the CDN endpoint too)
# ---------------------------------------------------------------------------
query VerifyImages {
  properties { slug images { url } }
  agents { slug photo { url } }
  agencies { slug logo { url } }
}

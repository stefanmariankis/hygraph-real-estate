# City / Neighborhood / Testimonial — content import.
# Paste into the Hygraph API Playground (Content API (master)) and run the
# operations in order using the dropdown next to the run button.
#
# The MODELS AND FIELDS must exist first — the Playground cannot create schema.
# See the table in the chat for what to build in Schema.

mutation CreateCities {
  c1: createCity(
    data: {
      name: "Cluj-Napoca"
      slug: "cluj-napoca"
      county: "Cluj"
      description: { children: [{ type: "paragraph", children: [{ text: "Romania's second-largest urban economy and its most expensive housing market outside the capital, driven by a dense IT and university population." }] }] }
    }
  ) { id slug }

  c2: createCity(
    data: {
      name: "Bucharest"
      slug: "bucharest"
      county: "Bucuresti"
      description: { children: [{ type: "paragraph", children: [{ text: "The capital and by far the largest market, spanning six sectors with very different price levels and building stock." }] }] }
    }
  ) { id slug }

  c3: createCity(
    data: {
      name: "Bistrita"
      slug: "bistrita"
      county: "Bistrita-Nasaud"
      description: { children: [{ type: "paragraph", children: [{ text: "A small Transylvanian county seat with a compact historic centre and a slower, more affordable market." }] }] }
    }
  ) { id slug }

  c4: createCity(
    data: {
      name: "Oradea"
      slug: "oradea"
      county: "Bihor"
      description: { children: [{ type: "paragraph", children: [{ text: "Known for its restored Art Nouveau centre and steady municipal investment, close to the Hungarian border." }] }] }
    }
  ) { id slug }

  c5: createCity(
    data: {
      name: "Timisoara"
      slug: "timisoara"
      county: "Timis"
      description: { children: [{ type: "paragraph", children: [{ text: "The largest city in western Romania, with a strong manufacturing and services base and heavy suburban expansion." }] }] }
    }
  ) { id slug }

}

mutation CreateNeighborhoods {
  n1: createNeighborhood(
    data: { name: "Gheorgheni", slug: "gheorgheni", city: { connect: { slug: "cluj-napoca" } } }
  ) { id slug }

  n2: createNeighborhood(
    data: { name: "Marasti", slug: "marasti", city: { connect: { slug: "cluj-napoca" } } }
  ) { id slug }

  n3: createNeighborhood(
    data: { name: "Buna Ziua", slug: "buna-ziua", city: { connect: { slug: "cluj-napoca" } } }
  ) { id slug }

  n4: createNeighborhood(
    data: { name: "Aviatiei", slug: "aviatiei", city: { connect: { slug: "bucharest" } } }
  ) { id slug }

  n5: createNeighborhood(
    data: { name: "Militari", slug: "militari", city: { connect: { slug: "bucharest" } } }
  ) { id slug }

  n6: createNeighborhood(
    data: { name: "Dumbravita", slug: "dumbravita", city: { connect: { slug: "timisoara" } } }
  ) { id slug }

}

mutation LinkProperties {
  p1: updateProperty(
    where: { slug: "apartament-2-camere-gheorgheni" }
    data: {
      city: { connect: { slug: "cluj-napoca" } }
      neighborhood: { connect: { slug: "gheorgheni" } }
    }
  ) { id slug }

  p2: updateProperty(
    where: { slug: "garsoniera-moderna-marasti" }
    data: {
      city: { connect: { slug: "cluj-napoca" } }
      neighborhood: { connect: { slug: "marasti" } }
    }
  ) { id slug }

  p3: updateProperty(
    where: { slug: "apartament-4-camere-buna-ziua" }
    data: {
      city: { connect: { slug: "cluj-napoca" } }
      neighborhood: { connect: { slug: "buna-ziua" } }
    }
  ) { id slug }

  p4: updateProperty(
    where: { slug: "apartament-3-camere-aviatiei" }
    data: {
      city: { connect: { slug: "bucharest" } }
      neighborhood: { connect: { slug: "aviatiei" } }
    }
  ) { id slug }

  p5: updateProperty(
    where: { slug: "apartament-2-camere-militari" }
    data: {
      city: { connect: { slug: "bucharest" } }
      neighborhood: { connect: { slug: "militari" } }
    }
  ) { id slug }

  p6: updateProperty(
    where: { slug: "casa-cu-curte-dumbravita" }
    data: {
      city: { connect: { slug: "timisoara" } }
      neighborhood: { connect: { slug: "dumbravita" } }
    }
  ) { id slug }

}

mutation CreateTestimonials {
  t1: createTestimonial(
    data: {
      slug: "t-andrei-1"
      authorName: "Cristina Ilies"
      rating: 5
      quote: "Andrei knew every block on the street and told us which ones had already replaced the plumbing. We saw four apartments and bought the third."
      agent: { connect: { slug: "andrei-popescu" } }
    }
  ) { id slug }

  t2: createTestimonial(
    data: {
      slug: "t-andrei-2"
      authorName: "Bogdan Neamtu"

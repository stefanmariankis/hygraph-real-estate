    }
  ) { id slug }

  t8: createTestimonial(
    data: {
      slug: "t-urban-1"
      authorName: "Diana Preda"
      rating: 4
      quote: "Good coverage across the northern sectors. Their listings matched what we actually found on site, which was not true everywhere."
      agency: { connect: { slug: "urban-estate" } }
    }
  ) { id slug }

  t9: createTestimonial(
    data: {
      slug: "t-west-1"
      authorName: "Ionut Barbu"
      rating: 5
      quote: "A small office, but they know the suburbs around Timisoara better than the big agencies do."
      agency: { connect: { slug: "west-home" } }
    }
  ) { id slug }

}

mutation PublishModels {
  cities: publishManyCitiesConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id slug } }
  }
  neighborhoods: publishManyNeighborhoodsConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id slug } }
  }
  testimonials: publishManyTestimonialsConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id slug } }
  }
  properties: publishManyPropertiesConnection(from: DRAFT, to: PUBLISHED, first: 100) {
    edges { node { id slug } }
  }
}

query VerifyModels {
  cities { slug name county }
  neighborhoods { slug name city { slug } }
  testimonials { slug authorName rating agent { slug } agency { slug } }
  properties { slug city { slug } neighborhood { slug } images { url } }
}
